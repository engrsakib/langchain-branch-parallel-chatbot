repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1 
    hooks:
      - id: ruff-format
        args: [--check]
      - id: ruff
        args: [--fix]

  - repo: local
    hooks:
      - id: pytest
        name: run pytest
        entry: python -m pytest
        language: system
        pass_filenames: false
        always_run: true